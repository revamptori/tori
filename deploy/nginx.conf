# ==============================================================================
# Production Nginx Reverse Proxy Configuration for Tori Portfolio
# Terminates TLS, enables Gzip/Brotli, proxies /api and static assets to flap.
# ==============================================================================

upstream flap_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tori.dev www.tori.dev;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tori.dev www.tori.dev;

    # SSL Configuration (Let's Encrypt / Production Certs)
    ssl_certificate /etc/letsencrypt/live/tori.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tori.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com;" always;

    # Performance: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    root /home/user/tori/frontend/dist;
    index index.html;

    # Static assets with aggressive caching
    location /assets/ {
        alias /home/user/tori/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon
    location = /favicon.svg {
        alias /home/user/tori/frontend/dist/favicon.svg;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # API Proxy to flap Backend
    location /api/ {
        proxy_pass http://flap_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # SPA Fallback: Any other path routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
